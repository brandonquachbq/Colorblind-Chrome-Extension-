<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Test figure — red/green</title>
    <style>
      body { font-family: sans-serif; padding: 24px; max-width: 760px; }
      figure { margin: 24px 0; }
      figcaption { font-size: 13px; color: #555; }
      .icon { width: 24px; height: 24px; } /* should be ignored (too small) */
    </style>
  </head>
  <body>
    <h1>Daltonization test figure</h1>
    <p>
      Enable the extension, then hover over the figure below. Red and green
      points should become easier to tell apart, and a blue outline appears.
      The tiny icon should NOT trigger the filter.
    </p>

    <img class="icon" alt="small icon" src="data:image/svg+xml;utf8,
      <svg xmlns='http://www.w3.org/2000/svg' width='24' height='24'><circle cx='12' cy='12' r='10' fill='%23d55e00'/></svg>" />

    <figure>
      <svg width="420" height="300" xmlns="http://www.w3.org/2000/svg">
        <rect width="420" height="300" fill="#ffffff" stroke="#ccc" />
        <!-- red cluster -->
        <g fill="#e8000b">
          <circle cx="120" cy="110" r="9" />
          <circle cx="150" cy="140" r="9" />
          <circle cx="100" cy="160" r="9" />
          <circle cx="170" cy="100" r="9" />
          <circle cx="140" cy="190" r="9" />
        </g>
        <!-- green cluster (overlapping range, confusable with red) -->
        <g fill="#1ac938">
          <circle cx="250" cy="120" r="9" />
          <circle cx="280" cy="160" r="9" />
          <circle cx="230" cy="180" r="9" />
          <circle cx="300" cy="110" r="9" />
          <circle cx="270" cy="200" r="9" />
        </g>
        <text x="120" y="260" font-size="14" fill="#e8000b">Condition A</text>
        <text x="250" y="260" font-size="14" fill="#1ac938">Condition B</text>
      </svg>
      <figcaption>Figure 1. Red (A) vs green (B) — a classic confusable pair.</figcaption>
    </figure>
  </body>
</html>
