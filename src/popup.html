<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daltonize</title>
    <style>
      :root {
        color-scheme: light dark;
        --accent: #0072b2;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        width: 260px;
        margin: 0;
        padding: 14px 16px;
        font-size: 13px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 12px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 12px 0;
      }
      label {
        font-weight: 500;
      }
      /* Toggle switch */
      .switch {
        position: relative;
        display: inline-block;
        width: 42px;
        height: 24px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background: #bbb;
        border-radius: 24px;
        transition: 0.2s;
      }
      .slider::before {
        content: "";
        position: absolute;
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background: #fff;
        border-radius: 50%;
        transition: 0.2s;
      }
      input:checked + .slider {
        background: var(--accent);
      }
      input:checked + .slider::before {
        transform: translateX(18px);
      }
      select,
      input[type="range"] {
        width: 130px;
      }
      .hint {
        margin-top: 14px;
        font-size: 11px;
        opacity: 0.7;
        line-height: 1.4;
      }
      kbd {
        background: rgba(127, 127, 127, 0.2);
        border-radius: 3px;
        padding: 1px 4px;
        font-size: 10px;
      }
      #strengthVal {
        font-variant-numeric: tabular-nums;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <h1>Daltonize</h1>

    <div class="row">
      <span>Enable on this browser</span>
      <label class="switch">
        <input type="checkbox" id="active" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="row">
      <label for="mode">Mode</label>
      <select id="mode">
        <option value="hover">Hover a figure</option>
        <option value="figures">All figures</option>
        <option value="page">Whole page</option>
      </select>
    </div>

    <div class="row">
      <label for="type">Deficiency type</label>
      <select id="type">
        <option value="deuteranopia">Deuteranopia (red/green)</option>
        <option value="protanopia">Protanopia (red/green)</option>
        <option value="tritanopia">Tritanopia (blue/yellow)</option>
      </select>
    </div>

    <div class="row">
      <label for="strength">Strength</label>
      <input type="range" id="strength" min="0" max="3" step="0.05" />
    </div>
    <div class="row" style="margin-top: -8px; justify-content: flex-end">
      <span id="strengthVal">100%</span>
    </div>

    <p class="hint">
      Toggle anytime with <kbd>⌘</kbd>+<kbd>Shift</kbd>+<kbd>9</kbd>. If the
      shortcut is taken, set your own at
      <a href="#" id="shortcuts">chrome://extensions/shortcuts</a>.
    </p>

    <script src="popup.js"></script>
  </body>
</html>
